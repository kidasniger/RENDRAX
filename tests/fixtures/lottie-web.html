<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0}.lottie-container{width:1920px;height:1080px}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
</head><body><div class="lottie-container" id="animation"></div>
<script>
const player = lottie.loadAnimation({
  container: document.getElementById('animation'),
  renderer: 'svg',
  loop: true,
  autoplay: true,
  path: 'animation.json'
});
</script></body></html>
