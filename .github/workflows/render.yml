name: Rendu vidéo
run-name: Rendu ${{ inputs.tag || inputs.fichier }}

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier HTML à convertir"
        required: true
        default: "tests/fixtures/gsap-audio-timeline.html"
      scale:
        description: "Échelle (vidéo : 1 ou 0.5 ; image : 1, 2 ou 3)"
        default: "1"
      test:
        description: "Secondes à rendre (0 = vidéo entière)"
        default: "0"
      duration:
        description: "Durée maximale en secondes (0 = durée détectée, sinon 60 s en mode universel)"
        required: false
        default: "0"
      format:
        description: "Format de sortie"
        type: choice
        options:
          - auto
          - portrait
          - landscape
          - square
        required: false
        default: "auto"
      watermark:
        description: "Ajouter le filigrane animé RENDRAX au MP4"
        type: boolean
        required: false
        default: false
      sortie:
        description: "Type de sortie"
        type: choice
        options:
          - mp4
          - png
          - jpeg
          - webp
        required: false
        default: "mp4"
      instant:
        description: "Image : instant de capture en secondes"
        required: false
        default: "0"
      pleine_page:
        description: "Image : capturer toute la hauteur de la page"
        type: boolean
        required: false
        default: false
      transparent:
        description: "Image PNG/WebP : fond transparent"
        type: boolean
        required: false
        default: false
      nom:
        description: "Nom du fichier de sortie (défaut : nom du fichier HTML)"
        required: false
        default: ""
      tag:
        description: "Identifiant de la vidéo (rempli par la page web)"
        required: false
        default: ""
      blob_id:
        description: "Identifiant du HTML temporaire dans le stockage privé"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      source_url_b64: ${{ steps.signed.outputs.source_url_b64 }}
      publish_url_b64: ${{ steps.signed.outputs.publish_url_b64 }}
    steps:
      - name: Signer les accès privés au HTML et au MP4
        id: signed
        env:
          BLOB_ID: ${{ inputs.blob_id }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          echo "source_url_b64=" >> "$GITHUB_OUTPUT"
          echo "publish_url_b64=" >> "$GITHUB_OUTPUT"
          if [ -z "$BLOB_ID" ]; then
            if [ -n "$TAG" ]; then
              echo "::error::Un rendu publié doit avoir un identifiant privé."
              exit 1
            fi
            exit 0
          fi

          [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
          [ "$TAG" = "$BLOB_ID" ] || { echo "::error::Les identifiants du HTML et de la vidéo doivent correspondre."; exit 1; }
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible}"

          OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_REQUEST_URL" | jq -er '.value')"
          echo "::add-mask::${OIDC_TOKEN}"

          SOURCE_URL="$(curl --fail --silent --show-error --location --retry 2 \
            "https://rendrax.vercel.app/api/source-url?id=${BLOB_ID}&run_id=${GITHUB_RUN_ID}" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" | jq -er '.url')"
          PUBLISH_URL="$(curl --fail --silent --show-error --location --retry 2 \
            -X POST "https://rendrax.vercel.app/api/publish-url" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"id\":\"${TAG}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" | jq -er '.url')"

          echo "::add-mask::${SOURCE_URL}"
          echo "::add-mask::${PUBLISH_URL}"
          echo "source_url_b64=$(printf '%s' "$SOURCE_URL" | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "publish_url_b64=$(printf '%s' "$PUBLISH_URL" | base64 -w0)" >> "$GITHUB_OUTPUT"

  render:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Installer FFmpeg et ffprobe depuis Ubuntu
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Installer websocket-client
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 20 websocket-client Pillow
          python -c "import websocket; print('websocket-client installé:', websocket.__version__)"
          python -c "import PIL; print('Pillow installé:', PIL.__version__)"

      - name: Préparer le HTML source
        id: source
        env:
          FICHIER: ${{ inputs.fichier }}
          BLOB_ID: ${{ inputs.blob_id }}
          SOURCE_URL_B64: ${{ needs.prepare.outputs.source_url_b64 }}
        run: |
          set -euo pipefail
          if [ -n "$BLOB_ID" ]; then
            [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
            [ -n "$SOURCE_URL_B64" ] || { echo "::error::URL privée de la source absente."; exit 1; }
            SOURCE_URL="$(printf '%s' "$SOURCE_URL_B64" | base64 --decode)"
            echo "::add-mask::$SOURCE_URL"
            mkdir -p kidas-tmp
            curl --fail --silent --show-error --location --retry 2 \
              "$SOURCE_URL" --output kidas-tmp/input.html
            unset SOURCE_URL SOURCE_URL_B64
            test -s kidas-tmp/input.html || { echo "::error::Le HTML temporaire est vide."; exit 1; }
            echo "fichier=kidas-tmp/input.html" >> "$GITHUB_OUTPUT"
          else
            case "$FICHIER" in
              tests/fixtures/*.html) ;;
              *) echo "::error::Sans import privé, seuls les exemples synthétiques de tests/fixtures sont autorisés."; exit 1 ;;
            esac
            test -f "$FICHIER" || { echo "::error::Exemple de test introuvable."; exit 1; }
            echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"
          fi

      - name: Rendre la vidéo
        if: ${{ inputs.sortie == 'mp4' }}
        env:
          FICHIER: ${{ steps.source.outputs.fichier }}
          FPS: "auto"
          SCALE: ${{ inputs.scale }}
          TEST: ${{ inputs.test }}
          DURATION: ${{ inputs.duration }}
          FORMAT: ${{ inputs.format }}
          NOM: ${{ inputs.nom }}
          QUALITE: "auto"
          WATERMARK: ${{ inputs.watermark }}
          RENDRAX_CHROME_NO_SANDBOX: "1"
        run: |
          set -euo pipefail
          args=(--file "$FICHIER" --fps "$FPS" --scale "$SCALE" --test "$TEST" --duration "$DURATION" --format "$FORMAT" --name "$NOM" --quality "$QUALITE")
          if [[ "${WATERMARK,,}" != "true" ]]; then
            args+=(--no-watermark)
            echo "Filigrane animé désactivé pour ce rendu."
          else
            echo "Filigrane animé RENDRAX activé."
          fi
          # Le job de rendu n'a aucun droit OIDC et ne reçoit que des URL limitées à ce fichier.
          while IFS='=' read -r env_name _; do
            case "$env_name" in
              *TOKEN*|*SECRET*|*PASSWORD*|*CREDENTIAL*) unset "$env_name" ;;
            esac
          done < <(env)
          python html2mp4.py "${args[@]}"

      - name: Rendre l'image
        if: \${{ inputs.sortie != 'mp4' }}
        env:
          FICHIER: \${{ steps.source.outputs.fichier }}
          SORTIE: \${{ inputs.sortie }}
          SCALE: \${{ inputs.scale }}
          INSTANT: \${{ inputs.instant }}
          FORMAT: \${{ inputs.format }}
          NOM: \${{ inputs.nom }}
          PLEINE_PAGE: \${{ inputs.pleine_page }}
          TRANSPARENT: \${{ inputs.transparent }}
          RENDRAX_CHROME_NO_SANDBOX: "1"
        run: |
          set -euo pipefail
          args=(--file "$FICHIER" --to "$SORTIE" --scale "$SCALE" --at "$INSTANT" --format "$FORMAT" --name "$NOM" --outdir rendrax-out)
          [[ "\${PLEINE_PAGE,,}" == "true" ]] && args+=(--full-page)
          [[ "\${TRANSPARENT,,}" == "true" ]] && args+=(--transparent)
          python html2mp4.py "\${args[@]}"
          ls -la rendrax-out

      - name: Envoyer le MP4 au stockage privé
        if: \${{ inputs.tag != '' && inputs.sortie == 'mp4' }}
        env:
          TAG: \${{ inputs.tag }}
          PUBLISH_URL_B64: \${{ needs.prepare.outputs.publish_url_b64 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant vidéo invalide."; exit 1; }
          [ -n "$PUBLISH_URL_B64" ] || { echo "::error::URL privée de publication absente."; exit 1; }
          FILE_PATH="$(find . -type f -name '*.mp4' -not -path './.git/*' -print -quit)"
          test -n "$FILE_PATH" || { echo "::error::Aucun MP4 à publier."; exit 1; }
          PUBLISH_URL="$(printf '%s' "$PUBLISH_URL_B64" | base64 --decode)"
          echo "::add-mask::$PUBLISH_URL"
          curl --fail --silent --show-error --location --retry 2 \
            --upload-file "$FILE_PATH" -H "Content-Type: video/mp4" "$PUBLISH_URL"
          unset PUBLISH_URL PUBLISH_URL_B64
          echo "MP4 envoyé dans le stockage privé."

      - name: Envoyer l'image au stockage privé
        if: \${{ inputs.tag != '' && inputs.sortie != 'mp4' }}
        env:
          TAG: \${{ inputs.tag }}
          SORTIE: \${{ inputs.sortie }}
          PUBLISH_URL_B64: \${{ needs.prepare.outputs.publish_url_b64 }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant du fichier invalide."; exit 1; }
          [ -n "$PUBLISH_URL_B64" ] || { echo "::error::URL privée de publication absente."; exit 1; }
          SOURCE_PATH="$(find rendrax-out -maxdepth 1 -type f -print -quit)"
          test -n "$SOURCE_PATH" || { echo "::error::Aucune image à publier."; exit 1; }
          FILE_PATH="rendrax-out/$TAG.$SORTIE"
          cp "$SOURCE_PATH" "$FILE_PATH"
          case "$SORTIE" in
            png) MIME="image/png" ;;
            jpeg) MIME="image/jpeg" ;;
            webp) MIME="image/webp" ;;
            *) echo "::error::Format d'image invalide."; exit 1 ;;
          esac
          PUBLISH_URL="$(printf '%s' "$PUBLISH_URL_B64" | base64 --decode)"
          echo "::add-mask::$PUBLISH_URL"
          curl --fail --silent --show-error --location --retry 2 \
            --upload-file "$FILE_PATH" -H "Content-Type: $MIME" "$PUBLISH_URL"
          unset PUBLISH_URL PUBLISH_URL_B64
          echo "Image envoyée dans le stockage privé."

  cleanup:
    if: always() && inputs.blob_id != ''
    needs: [prepare, render]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Supprimer les fichiers temporaires
        env:
          BLOB_ID: ${{ inputs.blob_id }}
          PREPARE_RESULT: ${{ needs.prepare.result }}
          RENDER_RESULT: ${{ needs.render.result }}
        run: |
          set -euo pipefail
          [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible}"

          OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "$OIDC_REQUEST_URL" | jq -er '.value')"
          echo "::add-mask::${OIDC_TOKEN}"

          CLEANUP_OWNER=false
          if [ "$PREPARE_RESULT" != "success" ] || [ "$RENDER_RESULT" != "success" ]; then
            CLEANUP_OWNER=true
          fi
          curl --fail --silent --show-error --location --retry 2 \
            -X POST "https://rendrax.vercel.app/api/cleanup" \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"id\":\"${BLOB_ID}\",\"run_id\":\"${GITHUB_RUN_ID}\",\"cleanup_owner\":${CLEANUP_OWNER}}"
