name: Rendu vidéo
run-name: Rendu ${{ inputs.tag || inputs.fichier }}

on:
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier HTML à convertir"
        required: true
        default: "kidas.html"
      scale:
        description: "Échelle (vidéo : 1 = 1080x1920, 0.5 = 540x960 ; image : 1, 2 ou 3 = définition ×1, ×2, ×3)"
        default: "1"
      test:
        description: "Secondes à rendre (0 = vidéo entière)"
        default: "0"
      duration:
        description: "Durée maximale en secondes (0 = durée détectée, sinon 60 s en mode universel)"
        required: false
        default: "0"
      format:
        description: "Format de sortie"
        type: choice
        options:
          - auto
          - portrait
          - landscape
          - square
        required: false
        default: "auto"
      watermark:
        description: "Ajouter le filigrane animé RENDRAX au MP4"
        type: boolean
        required: false
        default: false
      sortie:
        description: "Type de sortie : vidéo MP4 ou image"
        type: choice
        options:
          - mp4
          - png
          - jpeg
          - webp
        required: false
        default: "mp4"
      instant:
        description: "Image : instant de la capture en secondes (0 = première image)"
        required: false
        default: "0"
      pleine_page:
        description: "Image : capturer toute la hauteur de la page"
        type: boolean
        required: false
        default: false
      transparent:
        description: "Image PNG/WebP : fond transparent"
        type: boolean
        required: false
        default: false
      nom:
        description: "Nom du fichier de sortie (défaut : nom du fichier HTML)"
        required: false
        default: ""
      tag:
        description: "Identifiant de la vidéo (rempli par la page web)"
        required: false
        default: ""
      blob_id:
        description: "Identifiant du HTML temporaire dans le stockage privé"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Préparer le HTML source
        id: source
        env:
          FICHIER: ${{ inputs.fichier }}
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          set -euo pipefail
          if [ -n "$BLOB_ID" ]; then
            [[ "$BLOB_ID" =~ ^v[a-z0-9]{12,40}$ ]] || { echo "::error::Identifiant temporaire invalide."; exit 1; }
            : "${ACTIONS_ID_TOKEN_REQUEST_URL:?GitHub OIDC indisponible; vérifie id-token: write}"
            : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?GitHub OIDC indisponible; vérifie id-token: write}"
            OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
            OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_REQUEST_URL" | jq -er '.value')"
            echo "::add-mask::${OIDC_TOKEN}"
            mkdir -p kidas-tmp
            curl --fail --silent --show-error --location --retry 2 \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              "https://rendrax.vercel.app/api/runner-source?id=${BLOB_ID}&run_id=${GITHUB_RUN_ID}" \
              --output kidas-tmp/input.html
            test -s kidas-tmp/input.html || { echo "::error::Le HTML temporaire est vide."; exit 1; }
            echo "fichier=kidas-tmp/input.html" >> "$GITHUB_OUTPUT"
          else
            case "$FICHIER" in
              uploads/*)
                git fetch --no-tags origin video-uploads
                mkdir -p "$(dirname "$FICHIER")"
                git show "FETCH_HEAD:$FICHIER" > "$FICHIER"
                ;;
            esac
            if [ ! -f "$FICHIER" ]; then
              git fetch --depth=1 origin uploads
              git checkout FETCH_HEAD -- "$FICHIER"
            fi
            echo "fichier=$FICHIER" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer FFmpeg et ffprobe (binaires statiques en cache)
        id: static_ffmpeg
        if: ${{ inputs.sortie == 'mp4' }}
        continue-on-error: true
        timeout-minutes: 6
        uses: FedericoCarboni/setup-ffmpeg@37062fbf7149fc5578d6c57e08aed62458b375d6 # v3.1
        with:
          ffmpeg-version: release

      - name: Installer FFmpeg depuis Ubuntu si le téléchargement échoue
        if: ${{ inputs.sortie == 'mp4' && steps.static_ffmpeg.outcome == 'failure' }}
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Vérifier les outils média
        if: ${{ inputs.sortie == 'mp4' }}
        run: |
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Installer websocket-client
        timeout-minutes: 3
        run: |
          python -m pip install --disable-pip-version-check --no-input --retries 2 --timeout 20 websocket-client Pillow
          python -c "import websocket; print('websocket-client installé:', websocket.__version__)"
          python -c "import PIL; print('Pillow installé:', PIL.__version__)"

      - name: Rendre la vidéo
        if: ${{ inputs.sortie == 'mp4' }}
        env:
          FICHIER: ${{ steps.source.outputs.fichier }}
          FPS: "auto"
          SCALE: ${{ inputs.scale }}
          TEST: ${{ inputs.test }}
          DURATION: ${{ inputs.duration }}
          FORMAT: ${{ inputs.format }}
          NOM: ${{ inputs.nom }}
          QUALITE: "auto"
          WATERMARK: ${{ inputs.watermark }}
        run: |
          args=(--file "$FICHIER" --fps "$FPS" --scale "$SCALE" --test "$TEST" --duration "$DURATION" --format "$FORMAT" --name "$NOM" --quality "$QUALITE")
          if [[ "${WATERMARK,,}" != "true" ]]; then
            args+=(--no-watermark)
            echo "Filigrane animé désactivé pour ce rendu."
          else
            echo "Filigrane animé RENDRAX activé."
          fi
          python html2mp4.py "${args[@]}"

      - name: Rendre l'image
        if: ${{ inputs.sortie != 'mp4' }}
        env:
          FICHIER: ${{ steps.source.outputs.fichier }}
          SORTIE: ${{ inputs.sortie }}
          SCALE: ${{ inputs.scale }}
          INSTANT: ${{ inputs.instant }}
          FORMAT: ${{ inputs.format }}
          NOM: ${{ inputs.nom }}
          PLEINE_PAGE: ${{ inputs.pleine_page }}
          TRANSPARENT: ${{ inputs.transparent }}
        run: |
          # Les images vont dans un dossier dédié : le dépôt contient déjà des PNG (logos, icônes) qui ne doivent pas être publiés.
          args=(--file "$FICHIER" --to "$SORTIE" --scale "$SCALE" --at "$INSTANT" --format "$FORMAT" --name "$NOM" --outdir rendrax-out)
          [[ "${PLEINE_PAGE,,}" == "true" ]] && args+=(--full-page)
          [[ "${TRANSPARENT,,}" == "true" ]] && args+=(--transparent)
          python html2mp4.py "${args[@]}"
          ls -la rendrax-out

      - name: Publier le MP4 (artefact)
        if: ${{ inputs.sortie == 'mp4' }}
        uses: actions/upload-artifact@v4
        with:
          name: video-mp4
          path: "**/*.mp4"
          if-no-files-found: error

      - name: Publier le MP4 (Release, pour la page web)
        if: ${{ inputs.sortie == 'mp4' && inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" $(find . -name '*.mp4' -not -path './.git/*') \
            --title "Vidéo $TAG" --notes "Générée par le workflow Rendu vidéo."
      - name: Publier l'image (artefact)
        if: ${{ inputs.sortie != 'mp4' }}
        uses: actions/upload-artifact@v4
        with:
          name: image-export
          path: rendrax-out/*
          if-no-files-found: error

      - name: Publier l'image (Release, pour la page web)
        if: ${{ inputs.sortie != 'mp4' && inputs.tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" rendrax-out/* \
            --title "Image $TAG" --notes "Générée par le workflow Rendu vidéo."
      - name: Supprimer les fichiers temporaires
        if: always()
        env:
          BLOB_ID: ${{ inputs.blob_id }}
        run: |
          rm -rf kidas-tmp rendrax-out
          if [ -n "$BLOB_ID" ]; then
            if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
              echo "::warning::OIDC indisponible; le HTML privé doit être supprimé depuis le stockage Vercel."
              exit 0
            fi
            OIDC_REQUEST_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https%3A%2F%2Frendrax.vercel.app%2Fkidas-render"
            if ! OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "$OIDC_REQUEST_URL" | jq -er '.value')"; then
              echo "::warning::Impossible d’obtenir le jeton OIDC pour le nettoyage."
              exit 0
            fi
            echo "::add-mask::${OIDC_TOKEN}"
            curl --fail --silent --show-error --location --retry 2 \
              -X POST "https://rendrax.vercel.app/api/cleanup" \
              -H "Authorization: Bearer ${OIDC_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"id\":\"${BLOB_ID}\",\"run_id\":\"${GITHUB_RUN_ID}\"}" \
              || echo "::warning::Le nettoyage du HTML privé a échoué; vérifie les journaux Vercel."
          fi
