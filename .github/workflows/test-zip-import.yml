name: Test import ZIP

on:
  pull_request:
    paths:
      - "scripts/safe_extract_zip.py"
      - "h2m/**"
      - "html2mp4.py"
      - "tests/**"
      - ".github/workflows/test-zip-import.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zip-import:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer Chromium et FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - uses: browser-actions/setup-chrome@v1
      - name: Installer les dépendances Python
        run: python -m pip install --disable-pip-version-check websocket-client Pillow
      - name: Tester extraction et sécurité ZIP
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Rendu vidéo court avec le ZIP de fixture
        run: |
          mkdir -p "$RUNNER_TEMP/rendrax-zip"
          base64 -d tests/fixtures/zip-project.zip.b64 > "$RUNNER_TEMP/rendrax-zip/fixture.zip"
          python scripts/safe_extract_zip.py --archive "$RUNNER_TEMP/rendrax-zip/fixture.zip" --dest "$RUNNER_TEMP/rendrax-zip/extracted" --main index.html
          python html2mp4.py --file "$RUNNER_TEMP/rendrax-zip/extracted/index.html" --asset-root "$RUNNER_TEMP/rendrax-zip/extracted" --test 2 --scale 0.25 --no-watermark --name zip-import-smoke
          test -s zip-import-smoke.mp4 || find "$RUNNER_TEMP/rendrax-zip" -name "*.mp4" -size +0c | grep -q .
